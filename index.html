.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sep{height:1px;background:var(--bd);margin:12px 0}

#ls{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}

#sb{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);padding:6px 16px;font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:8px;z-index:100}

<script>
let accessToken=null,dbFileId=null,rootFolderId=null;
let db={patients:[],records:{},settings:{clinic1:{},clinic2:{}},nextId:1};
let syncTimer=null;

// =====================================================
// 起動処理：URLハッシュからトークンを取得
// =====================================================
function initApp(){
  const now=new Date();
  document.getElementById('rec-m').value=now.toISOString().slice(0,7);
  document.getElementById('exp-m').value=now.toISOString().slice(0,7);

  // ログイン後のリダイレクト戻り：URLハッシュにトークンが含まれる
  const hash=location.hash.substring(1);
  if(hash){
    const params={};
    hash.split('&').forEach(p=>{
      const[k,v]=p.split('=');
      params[k]=decodeURIComponent(v||'');
    });
    if(params.access_token){
      accessToken=params.access_token;
      // ハッシュをURLから消す（履歴に残さない）
      history.replaceState(null,'',location.pathname+location.search);
      // ローカルストレージに保存（同タブ内のみ）
      sessionStorage.setItem('gd_tok',accessToken);
      loadAndStart();
      return;
    }
  }

  // セッションストレージに保存済みトークンがある場合
  const saved=sessionStorage.getItem('gd_tok');
  if(saved){
    accessToken=saved;
    loadAndStart();
    return;
  }

  // どちらもない場合はログイン画面を表示したまま
}

    '&scope='+encodeURIComponent(SCOPES)+

async function loadAndStart(){

// =====================================================
// DRIVE API
// =====================================================
function setSS(state,msg){
  const d=document.getElementById('sd'),m=document.getElementById('sm');
  d.className='sd '+(state==='ok'?'ok':state==='syncing'?'syncing':'err');
  m.textContent=msg;
}

async function driveList(q){
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)&spaces=drive',{
    headers:{Authorization:'Bearer '+accessToken}
  });
  const j=await r.json();return j.files||[];
}

async function ensureFolder(name,parentId){
  const q="name='"+name+"' and mimeType='application/vnd.google-apps.folder' and '"+parentId+"' in parents and trashed=false";
  const files=await driveList(q);
  if(files.length)return files[0].id;
  const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]})
  });
  return (await r.json()).id;
}

async function ensureRootFolder(){
  const q="name='"+ROOT_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false";
  const files=await driveList(q);
  if(files.length){rootFolderId=files[0].id;return;}
  const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body:JSON.stringify({name:ROOT_NAME,mimeType:'application/vnd.google-apps.folder'})
  });
  rootFolderId=(await r.json()).id;
}

async function loadDB(){
  try{
    const q="name='db.json' and '"+rootFolderId+"' in parents and trashed=false";
    const files=await driveList(q);
    if(!files.length){await saveDB();return;}
    dbFileId=files[0].id;
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+dbFileId+'?alt=media',{
      headers:{Authorization:'Bearer '+accessToken}
    });
    db=await r.json();
    if(!db.settings)db.settings={clinic1:{},clinic2:{}};
  }catch(e){console.warn('loadDB',e);}
}

async function saveDB(){
  setSS('syncing','保存中...');
  try{
    const body=JSON.stringify(db,null,2);
    if(dbFileId){
      await fetch('https://www.googleapis.com/upload/drive/v3/files/'+dbFileId+'?uploadType=media',{
        method:'PATCH',
        headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
        body
      });
    }else{
      const meta={name:'db.json',parents:[rootFolderId]};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',new Blob([body],{type:'application/json'}));
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
        method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form
      });
      dbFileId=(await r.json()).id;
    }
    setSS('ok','保存済み '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){setSS('err','保存失敗');toast('保存失敗','err');}
}

function scheduleSave(){clearTimeout(syncTimer);syncTimer=setTimeout(saveDB,1500);}

async function uploadXlsx(folderId,fname,data){
  const meta={name:fname,parents:[folderId],mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form
  });
}

function buildWB(p,rec,monthStr,clinic){
  const wb=XLSX.read(XLSX_TEMPLATE,{type:'base64'});
  const ws=wb.Sheets['Sheet1'];
  const[year,mon]=monthStr.split('-').map(Number);
  function sc(addr,val){if(!ws[addr])ws[addr]={};ws[addr].v=val;ws[addr].t=typeof val==='number'?'n':'s';}
  sc('AQ2',reiwa(year)+'年');sc('BE2',year+'年');sc('BN2',mon+'月分）（はり・きゅう用）');
  sc('BJ17',p.insNum||'');sc('C23',p.insSym||'');
  sc('G25',(p.name||'')+(p.kana?'\n（'+p.kana+'）':''));
  if(p.birth)sc('G30',toEra(new Date(p.birth)));
  if(p.injDate){const d=new Date(p.injDate);sc('AP24','令和'+reiwa(d.getFullYear())+'年');sc('AW24',(d.getMonth()+1)+'月');sc('BD24',d.getDate()+'日');}
  sc('BH23',p.disease||'');sc('DM7',parseInt(p.benefit)||7);
  const COL={1:'N',2:'R',3:'V',4:'Z',5:'AD',6:'AH',7:'AL',8:'AP',9:'AT',10:'AX',11:'BB',12:'BF',13:'BJ',14:'BN',15:'BR',16:'BV',17:'BZ',18:'CB',19:'CE',20:'CH',21:'CL',22:'CN',23:'CR',24:'CV',25:'CZ',26:'DD',27:'DH',28:'DL',29:'DP',30:'DT',31:'DX'};
  Object.entries(rec.days||{}).forEach(([d,t])=>{const col=COL[parseInt(d)];if(col)sc(col+'56',t==='o'?'◎':'〇');});
  sc('H56',mon+'月');sc('CS32',Object.keys(rec.days||{}).length);
  const f=rec.fees||{};
  if(f.firstExam)sc('AN35',f.firstExam);
  if(f.tsushoU)sc('AN37',f.tsushoU);if(f.tsushoC)sc('BH37',f.tsushoC);
  if(f.v1U)sc('AN39',f.v1U);if(f.v1C)sc('BH39',f.v1C);
  if(f.v2U)sc('AN41',f.v2U);if(f.v2C)sc('BH41',f.v2C);
  if(f.v3aU)sc('AN43',f.v3aU);if(f.v3aC)sc('BH43',f.v3aC);
  if(f.v3bU)sc('AN45',f.v3bU);if(f.v3bC)sc('BH45',f.v3bC);
  if(f.elecU)sc('AN47',f.elecU);if(f.elecC)sc('BH47',f.elecC);
  if(f.specU)sc('AN48',f.specU);if(f.specC)sc('BH48',f.specC);
  if(f.homeU)sc('AN49',f.homeU);if(f.homeC)sc('BH49',f.homeC);
  if(f.rptU)sc('AN50',f.rptU);if(f.rptC)sc('BH50',f.rptC);
  if(f.copay)sc('CO52',f.copay);
  if(clinic){sc('CA62',clinic.addr||'');sc('BR63',clinic.name||'');sc('BR64',clinic.mgr||'');sc('DC64',clinic.tel||'');sc('D63',clinic.reg||'');if(clinic.pref)sc('AW4',clinic.pref);if(clinic.fac)sc('BJ4',clinic.fac);}
  const td=new Date();sc('D68','令和'+reiwa(td.getFullYear())+'年');sc('H68',(td.getMonth()+1)+'月');sc('AC68',td.getDate()+'日');
  sc('BR69',p.addr||'');sc('BR70',p.name||'');sc('DC70',p.tel||'');
  return wb;
}
function reiwa(y){return y-2018;}
function toEra(d){
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  let era='',ey=0;
  if(y>2019||(y===2019&&m>=5)){era='令';ey=y-2018;}
  else if(y>=1989){era='平';ey=y-1988;}
  else{era='昭';ey=y-1925;}
  return era+'和'+ey+'年'+m+'月'+day+'日生';
}
function loadSettUI(){
  const s=db.settings||{};
  [['s1-name','clinic1','name'],['s1-addr','clinic1','addr'],['s1-tel','clinic1','tel'],['s1-mgr','clinic1','mgr'],['s1-reg','clinic1','reg'],['s1-pref','clinic1','pref'],['s1-fac','clinic1','fac'],
   ['s2-name','clinic2','name'],['s2-addr','clinic2','addr'],['s2-tel','clinic2','tel'],['s2-mgr','clinic2','mgr'],['s2-reg','clinic2','reg'],['s2-pref','clinic2','pref'],['s2-fac','clinic2','fac'],
  ].forEach(([id,cl,k])=>{const el=document.getElementById(id);if(el)el.value=(s[cl]&&s[cl][k])||'';});
}
function saveSetting(){
  if(!db.settings)db.settings={clinic1:{},clinic2:{}};
  [['s1-name','clinic1','name'],['s1-addr','clinic1','addr'],['s1-tel','clinic1','tel'],['s1-mgr','clinic1','mgr'],['s1-reg','clinic1','reg'],['s1-pref','clinic1','pref'],['s1-fac','clinic1','fac'],
   ['s2-name','clinic2','name'],['s2-addr','clinic2','addr'],['s2-tel','clinic2','tel'],['s2-mgr','clinic2','mgr'],['s2-reg','clinic2','reg'],['s2-pref','clinic2','pref'],['s2-fac','clinic2','fac'],
  ].forEach(([id,cl,k])=>{const el=document.getElementById(id);if(!el)return;if(!db.settings[cl])db.settings[cl]={};db.settings[cl][k]=el.value;});
  scheduleSave();toast('設定を保存しました');
}
initApp();
